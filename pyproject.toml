[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cursor-dictation"
version = "0.1.0"
description = "Local Windows speech-to-text that delivers text at the active cursor."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Aaron Nichols" }]
dependencies = [
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.27,<1",
  "numpy>=2.0,<3",
  "PySide6>=6.8,<7",
  "pywin32>=308; sys_platform == 'win32'",
  "sounddevice>=0.5,<1",
]

[project.gui-scripts]
cursor-dictation = "cursor_dictation.app:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_dictation"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_audio: requires a real microphone",
  "live_model: requires a downloaded Whisper model",
  "windows_integration: changes Windows desktop state",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["cursor_dictation"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sounddevice.*", "faster_whisper.*", "win32api.*", "win32con.*", "win32gui.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cursor_dictation"]

[tool.coverage.report]
show_missing = true
skip_covered = true

