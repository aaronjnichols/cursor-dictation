name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  UV_LINK_MODE: copy

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Verify release version
        run: uv run python scripts/check_release_version.py "${{ github.ref_name }}"
      - name: Build and smoke-test package
        shell: powershell
        run: .\scripts\package.ps1
      - name: Create release archive and checksum
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $archive = "dist\Cursor-Dictation-$version-windows-x64.zip"
          Compress-Archive -Path "dist\Cursor Dictation" -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
      - name: Retain workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cursor-Dictation-${{ github.ref_name }}-windows-x64
          path: |
            dist/Cursor-Dictation-*-windows-x64.zip
            dist/Cursor-Dictation-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $archive = "dist\Cursor-Dictation-$version-windows-x64.zip"
          $notes = "docs\releases\${{ github.ref_name }}.md"
          $arguments = @(
            "release", "create", "${{ github.ref_name }}",
            $archive, "$archive.sha256",
            "--verify-tag",
            "--title", "Cursor Dictation $version"
          )
          if (Test-Path -LiteralPath $notes) {
            $arguments += @("--notes-file", $notes)
          }
          else {
            $arguments += "--generate-notes"
          }
          gh @arguments
